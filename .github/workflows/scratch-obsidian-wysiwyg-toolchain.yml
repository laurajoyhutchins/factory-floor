name: Scratch Obsidian WYSIWYG toolchain

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/scratch-obsidian-wysiwyg-toolchain.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover exact historical dependency lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace/template workspace/integration/real-parser

          cat > workspace/template/package.json <<'JSON'
          {
            "name": "wysiwyg-editor",
            "version": "1.0.0",
            "private": true,
            "license": "MIT",
            "description": "Obsidian plugin that renders markdown formatting as styled output in Live Preview.",
            "main": "main.js",
            "keywords": [
              "obsidian",
              "plugin",
              "markdown",
              "wysiwyg",
              "codemirror"
            ],
            "scripts": {
              "build": "node esbuild.config.mjs",
              "dev": "node esbuild.config.mjs watch",
              "test": "vitest run",
              "test:real-parser": "npm ci --prefix integration/real-parser && node integration/real-parser/use-root-lezer.mjs && npm test --prefix integration/real-parser",
              "verify": "npm test && npm run test:real-parser && npm run typecheck && npm run build",
              "typecheck": "tsc --noEmit"
            },
            "devDependencies": {
              "@codemirror/language": "^6.11.2",
              "@codemirror/state": "6.5.0",
              "@codemirror/view": "6.38.6",
              "@lezer/common": "^1.2.3",
              "@types/node": "^22.15.29",
              "esbuild": "^0.25.5",
              "jsdom": "^26.1.0",
              "obsidian": "^1.8.7",
              "typescript": "^5.8.3",
              "vitest": "^2.1.9"
            }
          }
          JSON

          cat > workspace/integration/real-parser/package.json <<'JSON'
          {
            "name": "wysiwyg-editor-real-parser-tests",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "test": "npm exec --prefix ../.. -- vitest run --config integration/real-parser/vitest.config.ts"
            },
            "devDependencies": {"@lezer/markdown": "1.6.3"}
          }
          JSON

          cat > workspace/integration/real-parser/package-lock.json <<'JSON'
          {
            "name": "wysiwyg-editor-real-parser-tests",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "wysiwyg-editor-real-parser-tests",
                "version": "1.0.0",
                "devDependencies": {"@lezer/markdown": "1.6.3"}
              },
              "node_modules/@lezer/common": {
                "version": "1.5.2",
                "resolved": "https://registry.npmjs.org/@lezer/common/-/common-1.5.2.tgz",
                "integrity": "sha512-sxQE460fPZyU3sdc8lafxiPwJHBzZRy/udNFynGQky1SePYBdhkBl1kOagA9uT3pxR8K09bOrmTUqA9wb/PjSQ==",
                "dev": true,
                "license": "MIT"
              },
              "node_modules/@lezer/highlight": {
                "version": "1.2.3",
                "resolved": "https://registry.npmjs.org/@lezer/highlight/-/highlight-1.2.3.tgz",
                "integrity": "sha512-qXdH7UqTvGfdVBINrgKhDsVTJTxactNNxLk7+UMwZhU13lMHaOBlJe9Vqp907ya56Y3+ed2tlqzys7jDkTmW0g==",
                "dev": true,
                "license": "MIT",
                "dependencies": {"@lezer/common": "^1.3.0"}
              },
              "node_modules/@lezer/markdown": {
                "version": "1.6.3",
                "resolved": "https://registry.npmjs.org/@lezer/markdown/-/markdown-1.6.3.tgz",
                "integrity": "sha512-jpGm5Ps+XErS+xA4urw7ogEGkeZOahVQF21Z6oECF0sj+2liwZopd2+I8uH5I/vZsRuuze3OxBREIANLf6KKUw==",
                "dev": true,
                "license": "MIT",
                "dependencies": {
                  "@lezer/common": "^1.5.0",
                  "@lezer/highlight": "^1.0.0"
                }
              }
            }
          }
          JSON

          expected='f8b3f25a123496cc3c35de56e4e5d37e1d7a1a41'
          : > workspace/candidate-hashes.txt
          found=''
          for cutoff in \
            2026-07-25T00:00:00Z \
            2026-07-26T00:00:00Z \
            2026-07-26T06:00:00Z \
            2026-07-26T12:00:00Z \
            2026-07-26T18:00:00Z \
            2026-07-26T20:00:00Z \
            2026-07-26T21:00:00Z \
            2026-07-26T22:00:00Z \
            2026-07-26T23:00:00Z \
            2026-07-26T23:30:00Z \
            2026-07-26T23:45:00Z \
            2026-07-26T23:59:59Z \
            2026-07-27T00:30:00Z \
            2026-07-27T01:00:00Z \
            2026-07-27T02:00:00Z
          do
            rm -rf workspace/candidate
            mkdir workspace/candidate
            cp workspace/template/package.json workspace/candidate/package.json
            (
              cd workspace/candidate
              npm install --package-lock-only --before="$cutoff" --cache "$GITHUB_WORKSPACE/workspace/npm-cache" >/dev/null
              actual="$(git hash-object package-lock.json)"
              echo "$cutoff $actual" | tee -a ../candidate-hashes.txt
              if [ "$actual" = "$expected" ]; then
                cp package-lock.json ../package-lock.json
              fi
            )
            if [ -f workspace/package-lock.json ]; then
              found="$cutoff"
              break
            fi
          done

          test -n "$found"
          echo "matched_cutoff=$found" | tee workspace/match.txt
          cp workspace/template/package.json workspace/package.json
          (
            cd workspace
            npm ci --cache "$PWD/npm-cache"
            npm ci --prefix integration/real-parser --cache "$PWD/npm-cache"
          )
          tar -C workspace -czf workspace/exact-dependency-cache.tgz npm-cache package-lock.json candidate-hashes.txt match.txt

      - name: Upload exact dependency reconstruction
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-wysiwyg-exact-npm-reconstruction
          path: workspace/exact-dependency-cache.tgz
          if-no-files-found: error
          retention-days: 1
